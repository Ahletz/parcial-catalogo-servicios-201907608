name: catalogo-servicios-201907608

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: catalogo-servicios:local
  environment: &app-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY en .env}
    DJANGO_SETTINGS_MODULE: config.settings
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
    DB_NAME: ${DB_NAME:-catalogo}
    DB_USER: ${DB_USER:-catalogo}
    DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    DB_HOST: db
    DB_PORT: "5432"
    DEMO_ADMIN_IDENTIFICADOR: ${DEMO_ADMIN_IDENTIFICADOR:-admin.demo}
    DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-CONFIGURAR_LOCALMENTE}
    DEMO_CONSULTA_IDENTIFICADOR: ${DEMO_CONSULTA_IDENTIFICADOR:-consulta.demo}
    DEMO_CONSULTA_PASSWORD: ${DEMO_CONSULTA_PASSWORD:-CONFIGURAR_LOCALMENTE}
  volumes:
    - ./ENUNCIADO.md:/fuentes/ENUNCIADO.md:ro
    - ./data/CatalogoServicios.xlsx:/fuentes/CatalogoServicios.xlsx:ro
    - ./data/CatalogoServicios.xlsx:/app/data/CatalogoServicios.xlsx:ro
  networks: [datos]

services:
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: ${DB_NAME:-catalogo}
      POSTGRES_USER: ${DB_USER:-catalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks: [datos]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
  init:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    networks: [datos, interfaz]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/login/', timeout=3).status == 200"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  runner:
    <<: *app
    profiles: [pruebas]
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: config.settings_test
      DB_TEST_NAME: test_catalogo_final
    command: ["python", "manage.py", "check"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

networks:
  datos:
    internal: true
  interfaz:
    driver: bridge
volumes:
  datos_postgres:
